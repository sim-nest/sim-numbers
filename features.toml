[[feature]]
id = "feature/sim-numbers/tensor-decomposition"
title = "Evidence-carrying tensor decomposition"
summary = "Factor immutable dense matrices and compute matrix functions with bounded QR, eigen, Schur, SVD, scaling-and-squaring exponential, and Schur-backed matrix equations, retaining method and residual evidence."
owner = "crate/sim-lib-numbers-tensor-decomp"
audiences = ["code", "framework", "user"]
guidance = "Use qr_f64 for optional column-pivoted QR, symmetric_eigen_f64 for admitted symmetry, real_schur_f64 for general real spectra, and svd_f64 for stable rectangular decomposition without normal equations. Use matrix_power_f64, matrix_exponential_f64, solve_sylvester_f64, and solve_lyapunov_f64 for reviewed matrix functions and equations with scale, Pade order, squaring, separation, and residual evidence. Derive rank, condition, pseudoinverse, least squares, and null spaces from one caller cutoff. Provider factors require local admission. Reuse tensor-linalg for direct solves; decomposition remains the single matrix-function owner."
claims_anchors = [
  "anchor/crate/sim-lib-numbers-tensor-decomp",
  "anchor/runtime-lib/sim-lib-numbers-tensor-decomp/tensor-decomp-lib",
  "anchor/rustdoc/sim-lib-numbers-tensor-decomp/qr-factorization",
  "anchor/rustdoc/sim-lib-numbers-tensor-decomp/symmetric-eigen",
  "anchor/rustdoc/sim-lib-numbers-tensor-decomp/real-schur",
  "anchor/rustdoc/sim-lib-numbers-tensor-decomp/svd",
  "anchor/rustdoc/sim-lib-numbers-tensor-decomp/matrix-exponential",
  "anchor/rustdoc/sim-lib-numbers-tensor-decomp/matrix-equation-solution",
]
claims_specimens = ["spec-test/sim-numbers/crates/sim-lib-numbers-tensor-decomp/src/tests"]

