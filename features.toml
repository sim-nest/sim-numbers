[[feature]]
id = "feature/sim-numbers/coefficient-polynomial"
title = "Certified coefficient polynomial algebra"
summary = "Represent ordinary, integer-exponent Laurent, and rational-exponent Puiseux coefficient rows with canonical zeros, exact identities, certified floating evaluation, companion-Schur roots, and guarded Pade approximants."
owner = "crate/sim-lib-numbers-poly"
audiences = ["code", "framework", "user"]
guidance = "Use sim-lib-numbers-poly when coefficients and their exponent lattice are the data: dense Polynomial, integer-exponent LaurentPolynomial, rational-exponent PuiseuxPolynomial, Horner error evidence, exact rational GCD/division, root certificates, or Pade construction. Use sim-lib-numbers-cas instead when expressions, symbols, rewriting, or formula differentiation are the data. Root extraction composes the canonical tensor-decomp Schur path; it does not introduce another eigen owner."
claims_anchors = [
  "anchor/crate/sim-lib-numbers-poly",
  "anchor/runtime-lib/sim-lib-numbers-poly/poly-lib",
  "anchor/rustdoc/sim-lib-numbers-poly/polynomial",
  "anchor/rustdoc/sim-lib-numbers-poly/laurent-polynomial",
