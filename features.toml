[[feature]]
id = "feature/sim-numbers/statistical-inference"
title = "Bounded statistical and sequence inference"
summary = "Compute exact binary uncertainty, deterministic bootstrap intervals, versioned replayable sampling, bounded Latin hypercube and Sobol designs, standardized moments and Kolmogorov-Smirnov statistics, alpha-spent registered looks, robust dispersion, clustering, mixtures, streaming quantiles, and finite hidden-state inference with explicit work and termination evidence."
owner = "crate/sim-lib-numbers-stats"
audiences = ["code", "framework", "user"]
guidance = "Use SeededSampler when deterministic numeric work needs version identity, exact word accounting, replay state, or labeled substreams; existing clustering, HMM, and bootstrap paths preserve their published SplitMix64-v1 mappings. Use LatinHypercubePlan or the reviewed bounded SobolPlan for reconstructable space-filling sweeps, then SweepPlan for boundary, duplicate, occupancy, sampler, and caller-owned untested-region evidence. Use standardized_moments with an explicit population or adjusted-sample convention and Kolmogorov-Smirnov reports with exact-statistic or asymptotic identity. Reuse BootstrapControl across independent, paired, and cluster-preserving resampling. Seal optional-stopping policy with RegisteredLookSequence. Use fit_kmeans or fit_gmm for bounded clustering, QuantileSketch for mergeable ranks, and HiddenMarkovModel for finite sequence inference. Point clustering does not own temporal alignment: compose sim-lib-discrete-graph dynamic_time_warp or layered_shortest_path when observation order matters."
claims_anchors = [
  "anchor/crate/sim-lib-numbers-stats",
  "anchor/runtime-lib/sim-lib-numbers-stats/stats-numbers-lib",
  "anchor/rustdoc/sim-lib-numbers-stats/fit_gmm",
