  "anchor/rustdoc/sim-lib-numbers-poly/root-evidence",
  "anchor/rustdoc/sim-lib-numbers-poly/pade-approximant",
]
claims_specimens = ["spec-test/sim-numbers/crates/sim-lib-numbers-poly/src/tests"]

[[route]]
id = "route/sim-numbers/coefficient-polynomial"
title = "Compute with coefficient polynomials and evidence"
audiences = ["framework", "user"]
