  "anchor/crate/sim-lib-numbers-optimize",
  "anchor/rustdoc/sim-lib-numbers-optimize/objective-plan",
  "anchor/rustdoc/sim-lib-numbers-optimize/least-squares-plan",
  "anchor/rustdoc/sim-lib-numbers-optimize/minimize_scalar",
  "anchor/rustdoc/sim-lib-numbers-optimize/linear_least_squares",
]
claims_specimens = ["spec-test/sim-numbers/crates/sim-lib-numbers-optimize/src/tests"]

[[route]]
id = "route/sim-numbers/bounded-optimization"
title = "Choose and run a bounded optimizer"
steps = [
  { feature = "feature/sim-numbers/bounded-optimization", why = "Start from explicit bounds and select scalar Brent, projected BFGS, reflective least squares, or active-set linear least squares." },
  { feature = "feature/sim-numbers/method-evidence", why = "Declare termination and evidence requirements before running the selected optimizer." },
  { feature = "feature/sim-numbers/tensor-decomposition", why = "Reuse the canonical decomposition owner for rank and covariance evidence." },
  { specimen = "spec-test/sim-numbers/crates/sim-lib-numbers-optimize/src/tests", why = "The checked tests prove bounded steps, convergence evidence, covariance availability, and failure policy." },
  { specimen = "recipe/sim-numbers/crates/sim-lib-numbers-optimize/01-basics/bounded-optimization", why = "The runnable recipe demonstrates bounded optimization with visible evidence." },
]

[[feature]]
id = "feature/sim-numbers/method-evidence"
title = "Bounded numerical method evidence"
summary = "Plan numerical work with validated limits and criterion-specific tolerances, then inspect exact common evidence without replacing domain reports."
owner = "crate/sim-lib-numbers-method"
audiences = ["code", "framework", "user"]
guidance = "Use MethodPlan and MethodEvidence for shared boundedness, termination, achieved-error, precision, and execution queries. Compose DenseSolveAdapter, StatsKMeansAdapter, or SignalEstimatorAdapter beside the original domain report. Use sim-lib-numbers-core RealScalar only inside algorithms; it is deliberately not a runtime NumberDomain or promotion lattice."
claims_anchors = [
  "anchor/crate/sim-lib-numbers-method",
  "anchor/rustdoc/sim-lib-numbers-method/method-evidence",
  "anchor/rustdoc/sim-lib-numbers-method/method-plan",
  "anchor/rustdoc/sim-lib-numbers-core/real-scalar",
]
claims_specimens = [
  "spec-test/sim-numbers/crates/sim-lib-numbers-method/src/tests",
]

[[route]]
id = "route/sim-numbers/bounded-numerical-method"
title = "Plan and inspect a bounded numerical method"
audiences = ["framework", "user"]
steps = [
