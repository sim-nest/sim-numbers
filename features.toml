[[feature]]
id = "feature/sim-numbers/tensor-ode"
title = "Tensor ODE pipelines"
summary = "Run tensor-valued ODE state through the existing numeric ODE pipeline and Runge-Kutta solver registry."
owner = "crate/sim-lib-numbers-numeric"
audiences = ["code", "framework"]
guidance = "Use this row when an ODE state is a Tensor. Tensor state uses the same OdeProblem/OdePlan/OdeSolution surface and capability admission as scalar state. CPU runs accept ordinary callables; hardware tensor executors require a pure symbolic Func RHS whose sampled output has the same bounded shape and dtype as the state. The DOP853 reference backend provides eighth-order adaptive scalar/tensor parity with hard step and work refusal."
claims_specimens = [
  "spec-test/sim-numbers/crates/sim-lib-numbers-rk/src/tests",
]

[[feature]]
id = "feature/sim-numbers/implicit-radau-dae"
title = "Radau IIA stiff ODE and index-1 DAE integration"
summary = "Advance stiff ODEs and declared index-1 mass-matrix or residual DAEs with fifth-order Radau IIA, collocation dense output, common event semantics, and Newton/Jacobian/linear-solve evidence."
owner = "crate/sim-lib-numbers-implicit"
audiences = ["code", "framework", "user"]
guidance = "Use radau-iia for stiff systems and only use the DAE forms when the problem supplies M(t,y)y'=f(t,y) with an explicit differential mask or F(t,y,ydot)=0 with a differential/algebraic partition and stage Jacobian. Select analytic or AD Jacobians when available; finite differences require an explicit step declaration. Inspect failed Newton attempts, recomputation reasons, rank, reciprocal conditioning, and factor reuse before trusting difficult solves."
claims_anchors = [
  "anchor/crate/sim-lib-numbers-implicit",
  "anchor/runtime-lib/sim-lib-numbers-implicit/implicit-numbers-lib",
]
claims_specimens = [
  "spec-test/sim-numbers/crates/sim-lib-numbers-implicit/src/tests",
]

