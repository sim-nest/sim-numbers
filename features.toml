schema = "sim.features"

[[feature]]
id = "feature/sim-numbers/semantic-quantities"
title = "Semantic physical quantities"
owner = "crate/sim-lib-numbers-quantity"
audiences = ["code", "framework", "user"]
summary = "Compose generic installed scalars with bounded exact SI dimensions, open semantic kinds, exact affine units, point/interval laws, Shape admission, and canonical read construction."
guidance = "Use Quantity when physical meaning is part of the value contract. Dimension equality is necessary but semantic-kind equality is independently required: energy and torque deliberately refuse substitution. Implement Scalar for an installed number domain so conversions use exact rational constants inside that domain; do not convert through f64. DomainQuantity source strings remain construction evidence and are not numerical quantities."
claims_anchors = [
  "anchor/crate/sim-lib-numbers-quantity",
  "anchor/runtime-lib/sim-lib-numbers-quantity/quantity-lib",
  "anchor/rustdoc/sim-lib-numbers-quantity/quantity",
  "anchor/rustdoc/sim-lib-numbers-quantity/dimension",
  "anchor/rustdoc/sim-lib-numbers-quantity/measure-kind",
  "anchor/rustdoc/sim-lib-numbers-quantity/unit",
]
claims_specimens = ["spec-test/sim-numbers/crates/sim-lib-numbers-quantity/src/tests"]

[[route]]
id = "route/sim-numbers/semantic-quantity"
task = "Represent and combine a physical quantity"
audiences = ["framework", "user"]
steps = [
  { feature = "feature/sim-numbers/semantic-quantities", why = "The quantity owner composes generic scalars, exact dimensions, open semantic kinds, affine units, roles, Shape, and read construction." },
  { specimen = "spec-test/sim-numbers/crates/sim-lib-numbers-quantity/src/tests", why = "Checked laws prove kind mismatch refusal, affine behavior, exact conversion, rational powers, bounded construction, and semantic data closure." },
  { specimen = "recipe/sim-numbers/crates/sim-lib-numbers-quantity/01-basics/energy-and-torque", why = "The runtime recipe demonstrates the required equal-dimension, different-kind distinction." },
]

[enforcement.audience]
code = "strict"
framework = "strict"

[enforcement.specimen]
user = "strict"
framework = "strict"
code = "advisory"

[enforcement.route]
major_entrypoints = "advisory"
frameworks = "advisory"

[[feature]]
id = "feature/sim-numbers/special-functions-and-ranked-grid"
title = "Evidence-carrying special functions and ranked-grid interpolation"
owner = "crate/sim-lib-numbers-special"
audiences = ["code", "framework", "user"]
summary = "Compute reusable error, gamma, beta, elliptic, normal, Student-t, and ranked regular-grid results with explicit numerical regions, stable probability complements, tensor geometry, and resource evidence."
guidance = "Use sim-lib-numbers-special for general real special functions, stats for normal and Student-t distributions, and signal's RegularGridInterpolator for dense row-major grids. Direct survival functions preserve tails. Ranked monotone interpolation composes one-dimensional shape preservation but deliberately makes no multidimensional monotonicity claim."
claims_anchors = ["anchor/crate/sim-lib-numbers-special", "anchor/runtime-lib/sim-lib-numbers-special/special-numbers-lib", "anchor/rustdoc/sim-lib-numbers-special/accuracy-evidence", "anchor/rustdoc/sim-lib-numbers-signal/regular-grid-interpolator"]
claims_specimens = ["spec-test/sim-numbers/crates/sim-lib-numbers-special/src/tests", "spec-test/sim-numbers/crates/sim-lib-numbers-signal/src/regular_grid_tests"]

[[route]]
id = "route/sim-numbers/special-functions-and-ranked-grid"
title = "Compute special functions, distribution tails, or a ranked grid"
audiences = ["framework", "user"]
steps = [
  { feature = "feature/sim-numbers/special-functions-and-ranked-grid", why = "Select the single numerical owner and declare the tail or tensor policy before inspecting algorithm and bounded-work evidence." },
  { specimen = "spec-test/sim-numbers/crates/sim-lib-numbers-special/src/tests", why = "The checked special-function tests prove numerical-region selection and stable probability complements." },
  { specimen = "recipe/sim-numbers/crates/sim-lib-numbers-special/01-basics/gamma-tail", why = "The runnable gamma-tail recipe exposes the selected algorithm and retained evidence." },
]

[[feature]]
id = "feature/sim-numbers/extended-precision-convergence"
title = "Extended-precision convergence domain"
owner = "crate/sim-lib-numbers-extended"
audiences = ["code", "framework", "user"]
summary = "Inject normalized double-double arithmetic into shared numerical kernels while preserving exact component identity and the canonical number-domain promotion lattice."
guidance = "Use DoubleDouble through RealScalar when binary64 cancellation or convergence stalls before the requested tolerance. Load ExtendedNumbersLib for runtime literals and promotion from f64 or rational. This is fixed finite precision; use sim-lib-numbers-exotic continued fractions for lazy exact approximation and sim-lib-numbers-rational for exact oracles."
claims_anchors = [
  "anchor/crate/sim-lib-numbers-extended",
  "anchor/runtime-lib/sim-lib-numbers-extended/extended-numbers-lib",
  "anchor/rustdoc/sim-lib-numbers-extended/double-double",
]
claims_specimens = ["spec-test/sim-numbers/crates/sim-lib-numbers-extended/src/tests"]

[[route]]
id = "route/sim-numbers/extended-precision-convergence"
title = "Rerun a numerical kernel at extended precision"
audiences = ["framework", "user"]
steps = [
  { feature = "feature/sim-numbers/extended-precision-convergence", why = "Keep the algorithm fixed and select DoubleDouble at the RealScalar boundary." },
  { feature = "feature/sim-numbers/method-evidence", why = "Retain common convergence and bounded-work evidence beside the domain result." },
  { specimen = "spec-test/sim-numbers/crates/sim-lib-numbers-extended/src/tests", why = "The checked tests compare extended precision against exact rational oracles and binary64 behavior." },
  { specimen = "recipe/sim-numbers/crates/sim-lib-numbers-extended/01-basics/convergence", why = "The runnable convergence recipe demonstrates the precision-domain substitution." },
]

[[feature]]
id = "feature/sim-numbers/sealed-interval-certification"
title = "Sealed interval certification"
owner = "crate/sim-lib-numbers-interval"
audiences = ["code", "framework", "user"]
summary = "Keep estimates distinct from unforgeable mathematical enclosures carrying exact inputs, reviewed issuer identity, trace digest, and method evidence."
guidance = "Use EstimateInterval for numerical spreads and CertifiedInterval only when a definite decision needs a mathematical enclosure. Certificates are issued solely by exact-rational, directed-binary64, reviewed-sqrt, and scalar-root kernels; runtime data and provider reports are inspection inputs, never certificate constructors. Compose sim-lib-numbers-rational, sim-lib-numbers-root, and sim-lib-numbers-method for domain values and broader solver evidence without promoting their estimates or brackets."
claims_anchors = [
  "anchor/crate/sim-lib-numbers-interval",
  "anchor/runtime-lib/sim-lib-numbers-interval/interval-lib",
  "anchor/rustdoc/sim-lib-numbers-interval/certified-interval",
  "anchor/rustdoc/sim-lib-numbers-interval/estimate-interval",
  "anchor/rustdoc/sim-lib-numbers-interval/rational-interval",
  "anchor/rustdoc/sim-lib-numbers-interval/interval_newton",
  "anchor/rustdoc/sim-lib-numbers-interval/krawczyk",
]
claims_specimens = ["spec-test/sim-numbers/crates/sim-lib-numbers-interval/src/tests"]

[[route]]
id = "route/sim-numbers/sealed-interval-certification"
title = "Certify an enclosure and make a definite decision"
audiences = ["framework", "user"]
steps = [
  { feature = "feature/sim-numbers/sealed-interval-certification", why = "Start with exact inputs or an existing certificate and pass only reviewed certified intervals to definite classification." },
  { feature = "feature/sim-numbers/method-evidence", why = "Inspect the reviewed kernel and bounded method evidence without promoting an estimate into a certificate." },
  { specimen = "spec-test/sim-numbers/crates/sim-lib-numbers-interval/src/tests", why = "The checked tests prove sealed construction paths and refusal of forged or insufficient evidence." },
  { specimen = "recipe/sim-numbers/crates/sim-lib-numbers-interval/01-basics/sealed-threshold", why = "The runnable threshold recipe demonstrates a definite decision from certified bounds." },
]

[[feature]]
id = "feature/sim-numbers/bounded-optimization"
title = "Evidence-carrying bounded optimization"
owner = "crate/sim-lib-numbers-optimize"
summary = "Bounded scalar, smooth multivariate, nonlinear, and linear least-squares methods with explicit plans and convergence evidence."
guidance = "Use the bounded paths for box constraints; they use projected or active-set steps rather than clipping LM. Covariance is an availability result. Enable assignment only to convert numeric matrices into sim-discrete's certified solver; that crate remains the sole matching owner."
