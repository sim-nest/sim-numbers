[[feature]]
id = "feature/sim-numbers/signal-transforms"
title = "Reference-checked signal algorithms"
summary = "Transform with Fourier or wavelet plans, smooth and differentiate polynomials, solve Toeplitz systems, interpolate periodic or sampled data, estimate spectra, and guardedly deconvolve with explicit policy and diagnostics."
owner = "crate/sim-lib-numbers-signal"
audiences = ["code", "framework", "user"]
guidance = "Use TransformPlan when sign, normalization, packing, length, padding, stride, and placement must be reviewable, and WaveletPlan when family, level count, and periodic, symmetric, or zero extension must survive inverse reconstruction. Use SavitzkyGolaySpec for canonical factorial/sample-spacing derivative filters, ToeplitzPlan when singular pivots and residual evidence must be retained, and InterpolationPlan for linear, natural-cubic, or monotone-cubic sampled data with explicit duplicate-x and extrapolation policy. Use ConvolutionPlan or CorrelationPlan when geometry, boundary, normalization, lag order, direct/FFT cost selection, or retained span must be explicit. Use BlockConvolutionPlan for overlap-add/save latency and boundary evidence. Use DeconvolutionPlan only with a positive singular threshold and Tikhonov or truncated regularization. Use WindowSpec plus PeriodogramPlan, WelchPlan, MultitaperPlan, LombScarglePlan, or BurgPlan plus MemSpectrumPlan when window gain/energy, autoregressive stability/order, frequency grid, output scaling, residuals, degrees of freedom, and work admission must remain reconstructable; sound-spectrum is a domain adapter over the generic real FFT and must not introduce another Fourier convention. Use DftSeriesPlan for continuous periodic interpolation/integration and AnalyticSignalPlan for Hilbert, phase, frequency, and envelope workflows under the same Fourier conventions. Use TensorView plus transform_nd for borrowed multidimensional layouts and TransformResources plus transform_nd_blocked for caller-supplied Table/Dir blocks. Load SignalNumbersLib for the signal/transform, signal/convolve, signal/correlate, signal/deconvolve, signal/burg, and signal/dft-interpolate Lisp calls."
claims_anchors = [
  "anchor/crate/sim-lib-numbers-signal",
  "anchor/runtime-lib/sim-lib-numbers-signal/signal-numbers-lib",
  "anchor/rustdoc/sim-lib-numbers-signal/block-convolution-plan",
  "anchor/rustdoc/sim-lib-numbers-signal/block-convolution-report",
  "anchor/rustdoc/sim-lib-numbers-signal/analytic_signal",
