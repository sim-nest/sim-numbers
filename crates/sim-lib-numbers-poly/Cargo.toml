[package]
name = "sim-lib-numbers-poly"
version = "0.1.1"
edition = "2024"
license = "MPL-2.0"
description = "Evidence-carrying dense coefficient polynomials for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-numbers"
homepage = "https://github.com/sim-nest/sim-numbers"

[dependencies]
sim-cookbook = { version = "0.4.0" }
sim-kernel = { version = "0.4.0" }
sim-lib-numbers-complex = { version = "0.5.0", path = "../sim-lib-numbers-complex" }
sim-lib-numbers-tensor-decomp = { version = "0.2.0", path = "../sim-lib-numbers-tensor-decomp" }

[build-dependencies]
sim-cookbook-build = { version = "0.2.0" }

[lints]
workspace = true
