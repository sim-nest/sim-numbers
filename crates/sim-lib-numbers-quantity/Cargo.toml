[package]
name = "sim-lib-numbers-quantity"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Exact semantic dimensions, units, and generic physical quantities for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-numbers"
homepage = "https://github.com/sim-nest/sim-numbers"

[dependencies]
sim-citizen-derive = { version = "0.2.0" }
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.1" }
sim-shape = { version = "0.2.0" }

[dev-dependencies]
sim-codec = { version = "0.1.0" }
sim-codec-json = { version = "0.2.0" }
sim-codec-lisp = { version = "0.2.0" }
sim-kernel = { version = "0.2.1", features = ["test-support"] }

[build-dependencies]
sim-cookbook-build = { version = "0.1.0" }
