[package]
name = "sim-lib-numbers-method"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Validated bounded numerical method plans and canonical cross-domain evidence."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-numbers"
homepage = "https://github.com/sim-nest/sim-numbers"

[dependencies]
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.1" }
sim-lib-numbers-core = { version = "0.3.2", path = "../sim-lib-numbers-core" }
sim-lib-numbers-signal = { version = "0.1.0", path = "../sim-lib-numbers-signal", optional = true }
sim-lib-numbers-stats = { version = "0.4.0", path = "../sim-lib-numbers-stats", optional = true }
sim-lib-numbers-tensor-linalg = { version = "0.3.1", path = "../sim-lib-numbers-tensor-linalg", optional = true }

[features]
default = []
adapters = [
  "dep:sim-lib-numbers-signal",
  "dep:sim-lib-numbers-stats",
  "dep:sim-lib-numbers-tensor-linalg",
]

[build-dependencies]
sim-cookbook-build = { version = "0.1.0" }

[lints]
workspace = true
