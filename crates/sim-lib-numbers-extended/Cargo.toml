[package]
name = "sim-lib-numbers-extended"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Normalized double-double scalar and runtime number domain for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-numbers"
homepage = "https://github.com/sim-nest/sim-numbers"

[dependencies]
sim-citizen-derive = { version = "0.2.0" }
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.1" }
sim-lib-numbers-core = { version = "0.3.2", path = "../sim-lib-numbers-core" }

[dev-dependencies]
sim-lib-numbers-rational = { version = "0.3.1", path = "../sim-lib-numbers-rational" }

[build-dependencies]
sim-cookbook-build = { version = "0.1.0" }
