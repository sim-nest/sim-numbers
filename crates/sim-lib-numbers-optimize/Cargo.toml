[package]
name = "sim-lib-numbers-optimize"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Bounded optimization and evidence-carrying least squares for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-numbers"
homepage = "https://github.com/sim-nest/sim-numbers"

[features]
default = []
assignment = ["dep:sim-lib-discrete-graph"]

[dependencies]
sim-lib-discrete-graph = { version = "0.3.0", optional = true }
sim-cookbook = { version = "0.3.0" }
sim-kernel = { version = "0.3.0" }
sim-lib-numbers-tensor-decomp = { version = "0.1.0", path = "../sim-lib-numbers-tensor-decomp" }

[build-dependencies]
sim-cookbook-build = { version = "0.1.0" }

[lints]
workspace = true
