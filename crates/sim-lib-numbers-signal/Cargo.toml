[package]
name = "sim-lib-numbers-signal"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Deterministic Fourier, cosine, and sine transforms over canonical SIM tensors."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-numbers"
homepage = "https://github.com/sim-nest/sim-numbers"

[dependencies]
sim-lib-numbers-tensor-cmplxf = { version = "0.3.0", path = "../sim-lib-numbers-tensor-cmplxf" }
sim-lib-numbers-tensor-f64 = { version = "0.3.0", path = "../sim-lib-numbers-tensor-f64" }

[dev-dependencies]
sim-lib-numbers-tensor = { version = "0.2.0", path = "../sim-lib-numbers-tensor" }

[lints]
workspace = true
