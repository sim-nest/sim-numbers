[package]
name = "sim-lib-numbers-stats"
version = "0.4.0"
edition = "2024"
license = "MPL-2.0"
description = "Statistical and probability helpers for the SIM number stack."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-numbers"
homepage = "https://github.com/sim-nest/sim-numbers"

[dependencies]
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.1" }
sim-lib-numbers-core = { version = "0.3.2", path = "../sim-lib-numbers-core" }
sim-value = { version = "0.2.0" }

[lints]
workspace = true

[build-dependencies]
sim-cookbook = { version = "0.2.0" }

[[example]]
name = "bounded-sequence-inference"
path = "examples/bounded_sequence_inference.rs"

[[example]]
name = "clustering-evidence"
path = "examples/clustering_evidence.rs"
