[package]
name = "sim-lib-numbers-tensor-decomp"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Bounded, evidence-carrying QR and symmetric eigendecomposition for SIM tensors."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-numbers"
homepage = "https://github.com/sim-nest/sim-numbers"

[dependencies]
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.0" }
sim-lib-numbers-core = { version = "0.3.1", path = "../sim-lib-numbers-core" }
sim-lib-numbers-method = { version = "0.1.0", path = "../sim-lib-numbers-method", default-features = false }
sim-lib-numbers-tensor = { version = "0.2.1", path = "../sim-lib-numbers-tensor" }
sim-lib-numbers-tensor-linalg = { version = "0.3.1", path = "../sim-lib-numbers-tensor-linalg" }

[build-dependencies]
sim-cookbook-build = { version = "0.1.0" }

[lints]
workspace = true
